name: Deploy VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy. Defaults to the workflow branch.
        required: false
        type: string

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    env:
      RAG_LLM_RERANK_ENABLED: "0"
      RAG_TITLE_JIKAN_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Pin tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: |
          python -m pip install -r rag/requirements.txt
          npm ci

      - name: Check offline RAG contracts and real SDK initialization
        run: python -m unittest rag.eval.test_search_contracts rag.eval.test_character_and_groq rag.eval.test_full_enrichment rag.eval.test_bulk_enrichment rag.eval.test_service_readiness rag.eval.test_first_request -v

      - name: Check service lifecycle
        run: python -m unittest discover -s scripts/gcp/tests -v

      - name: Check backend
        run: |
          npm run build --workspace @panelflow/backend
          node --import tsx --test apps/backend/src/services/*.test.ts apps/backend/src/adapters/*.test.ts

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.GCP_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.GCP_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.GCP_SSH_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
      DEPLOY_REPO_PATH: ${{ secrets.GCP_REPO_PATH }}
      DEPLOY_REF: ${{ needs.preflight.outputs.sha }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Validate deploy secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_REPO_PATH"
          test -n "$DEPLOY_REF"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          {
          printf '%s\n' "$(printf '%s' "$GROQ_API_KEY" | base64 -w0)"
          cat <<'EOF'
          set -euo pipefail

          DEPLOY_REPO_REAL_PATH="$(realpath "$DEPLOY_REPO_PATH")"
          git config --global --add safe.directory "$DEPLOY_REPO_PATH"
          git config --global --add safe.directory "$DEPLOY_REPO_REAL_PATH"
          cd "$DEPLOY_REPO_REAL_PATH"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Deploy aborted: VM repo has uncommitted changes."
            git status --short
            exit 1
          fi

          git fetch --prune origin
          git checkout --detach "$DEPLOY_REF"

          if [ -n "$GROQ_KEY_BASE64" ]; then
            printf '%s' "$GROQ_KEY_BASE64" | sudo python3 scripts/gcp/configure-groq.py
          else
            echo "::warning::GROQ_API_KEY not supplied; existing VM provider configuration left unchanged."
          fi
          unset GROQ_KEY_BASE64

          npm run build --workspace @panelflow/backend

          # Match the interpreter selected by rag/start-rag.sh.
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          PY="$DEPLOY_REPO_REAL_PATH/.venv/bin/python"
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet -r rag/requirements.txt
          "$PY" -c 'import sys; from fastembed import TextEmbedding; import rag.rag_api; print("RAG runtime imports verified:", sys.executable)'
          # Exercise the real SDK factory in this exact runtime before downtime.
          "$PY" -m unittest rag.eval.test_first_request.TransportTests -v

          sudo -n bash scripts/gcp/restart-services.sh
          EOF
          } | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IFS= read -r GROQ_KEY_BASE64
             export GROQ_KEY_BASE64
             DEPLOY_REPO_PATH='$DEPLOY_REPO_PATH' DEPLOY_REF='$DEPLOY_REF' bash -s"
