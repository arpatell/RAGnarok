name: Deploy VM

on:
  workflow_run:
    workflows:
      - RAG Golden
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy. Defaults to the workflow branch.
        required: false
        type: string

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.GCP_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.GCP_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.GCP_SSH_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
      DEPLOY_REPO_PATH: ${{ secrets.GCP_REPO_PATH }}
      DEPLOY_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Validate deploy secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_REPO_PATH"
          test -n "$DEPLOY_REF"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          {
          printf '%s\n' "$(printf '%s' "$GROQ_API_KEY" | base64 -w0)"
          cat <<'EOF'
          set -euo pipefail

          DEPLOY_REPO_REAL_PATH="$(realpath "$DEPLOY_REPO_PATH")"
          git config --global --add safe.directory "$DEPLOY_REPO_PATH"
          git config --global --add safe.directory "$DEPLOY_REPO_REAL_PATH"
          cd "$DEPLOY_REPO_REAL_PATH"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Deploy aborted: VM repo has uncommitted changes."
            git status --short
            exit 1
          fi

          git fetch --prune origin
          git checkout --detach "$DEPLOY_REF"

          if [ -n "$GROQ_KEY_BASE64" ]; then
            printf '%s' "$GROQ_KEY_BASE64" | sudo python3 scripts/gcp/configure-groq.py
          else
            echo "::warning::GROQ_API_KEY not supplied; existing VM provider configuration left unchanged."
          fi
          unset GROQ_KEY_BASE64

          npm run build --workspace @panelflow/backend

          # Match the interpreter selected by rag/start-rag.sh.
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          PY="$DEPLOY_REPO_REAL_PATH/.venv/bin/python"
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet -r rag/requirements.txt
          "$PY" -c 'import sys; from fastembed import TextEmbedding; import rag.rag_api; print("RAG runtime imports verified:", sys.executable)'

          sudo systemctl restart ragnarok-rag.service

          echo "Waiting for RAG 'application startup complete'..."
          deadline=$((SECONDS + 480))
          rag_ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! sudo systemctl is-active --quiet ragnarok-rag.service; then
              echo "ragnarok-rag.service died during startup:"
              sudo journalctl -u ragnarok-rag.service -n 80 --no-pager || true
              exit 1
            fi
            if curl -fsS --max-time 5 http://127.0.0.1:8090/health 2>/dev/null \
              | grep -q '"initialized":"true"'; then
              rag_ready=1
              break
            fi
            sleep 5
          done
          if [ "$rag_ready" != 1 ]; then
            echo "Timed out waiting for RAG startup after 480s:"
            sudo journalctl -u ragnarok-rag.service -n 80 --no-pager || true
            exit 1
          fi
          echo "RAG is up; restarting backend..."
          sudo systemctl restart ragnarok-backend.service

          backend_deadline=$((SECONDS + 60))
          backend_ready=0
          while [ "$SECONDS" -lt "$backend_deadline" ]; do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health 2>/dev/null; then
              echo
              backend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$backend_ready" != 1 ]; then
            echo "Backend did not become healthy within 60s:"
            sudo journalctl -u ragnarok-backend.service -n 50 --no-pager || true
            exit 1
          fi
          EOF
          } | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IFS= read -r GROQ_KEY_BASE64
             export GROQ_KEY_BASE64
             DEPLOY_REPO_PATH='$DEPLOY_REPO_PATH' DEPLOY_REF='$DEPLOY_REF' bash -s"
