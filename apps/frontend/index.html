<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Canonical, discovery metadata and structured data are injected by Vite. -->
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Warm up origins that dominate page weight before they are needed:
         the backend API (metadata/search) and common manga image CDNs. -->
    <link rel="preconnect" href="https://api.myanimelist.net" crossorigin />
    <link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.myanimelist.net" />
    <link rel="dns-prefetch" href="https://s4.anilist.co" />
    <link rel="dns-prefetch" href="https://weebcentral.com" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
